name: Release

# 打 tag 即发版：校验 → 测试 → 构建 → 上传私有索引 → 建 GitHub Release。
# 此前全手工（build → 手动传 wheel → 手动发 Release），而索引不允许覆盖同版本，
# 一旦传错只能发新版本，故加自动化与前置校验。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 不设 UV_FROZEN：发版作业用 --locked 显式校验锁文件与 pyproject 一致
  # （UV_FROZEN 与 --locked 互斥，同时出现会直接报参数冲突）
  #
  # 分发只走 wheel：sdist 对插件开发者没有价值（本包是纯 Python，wheel 通用），
  # 却会在索引里多一份需要维护的产物，且构建 sdist 会触发一次额外的隔离构建。
  # 因此 uv build 只出 wheel，索引与 GitHub Release 也都只传 wheel。
  #
  # 上传仍是 Twine 协议的 legacy 端点（后台域名，与门户域名分开）：
  #   门户/API  https://pypi.luoqingciya.cn/       （/api/v1/packages 等只读接口）
  #   上传      https://admin.pypi.luoqingciya.cn/legacy/
  PYPI_PUBLISH_URL: https://admin.pypi.luoqingciya.cn/legacy/

jobs:
  verify:
    name: Verify tag / changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches __version__
        # 版本单一来源是 qingci_plugin_sdk.__version__；tag 与它不一致时直接失败，
        # 避免「发了 v1.14.0 的 tag、装出来还是 1.13.9」这类不可撤回的错误。
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("qingci_plugin_sdk/__init__.py").read_text(encoding="utf-8")
          print(re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1))
          PY
          )
          echo "tag=$tag  __version__=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag 与 __version__ $ver 不一致，请先升级版本号再打 tag"
            exit 1
          fi

      - name: CHANGELOG has an entry for this version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[$ver\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 '## [$ver]' 段落"
            exit 1
          fi
          echo "CHANGELOG 已记录 $ver"

  test:
    name: Test before publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.12 --extra dev

      - name: Lint / format / types
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy qingci_plugin_sdk plugins/_template

      - name: Test
        run: uv run --no-sync pytest --cov --cov-fail-under=90

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"

      - name: Build wheel
        # 只出 wheel：sdist 不参与分发（见文件头 env 注释）
        run: uv build --wheel

      - name: Guard wheel contents
        # wheel 必须带 py.typed，且不得泄漏 tests/ 与 plugins/（否则会装进下游
        # site-packages，与宿主的同名目录冲突）
        run: |
          uv run --no-project python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert "qingci_plugin_sdk/py.typed" in names, "wheel 缺少 py.typed"
          assert not any(n.startswith("tests/") for n in names), "wheel 泄漏 tests/"
          assert not any(n.startswith("plugins/") for n in names), "wheel 泄漏 plugins/"
          print(f"{whl}: {len(names)} 个文件，内容校验通过")
          PY

      - name: Checksums
        run: cd dist && sha256sum *.whl > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/SHA256SUMS

  publish:
    name: Publish to private index
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"

      - name: Publish
        # 索引协议不允许同版本覆盖：重复上传会失败，这是有意的保护
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.QINGCI_PYPI_TOKEN }}
        run: |
          if [ -z "$UV_PUBLISH_TOKEN" ]; then
            echo "::error::缺少仓库 secret QINGCI_PYPI_TOKEN（私有索引上传令牌）"
            echo "在 Settings → Secrets and variables → Actions 中添加后重跑本作业"
            exit 1
          fi
          # Twine 协议：用户名任意（--token 会以 __token__ 作为用户名），密码为令牌。
          # 令牌在仓库 secret QINGCI_PYPI_TOKEN 中，作用域限定 qingci_plugin_sdk 文件夹。
          # 只传 wheel（sdist 不参与分发）。
          uv publish --publish-url "$PYPI_PUBLISH_URL" --token "$UV_PUBLISH_TOKEN" dist/*.whl

      - name: Verify it landed in the index
        # 上传返回 2xx 不等于制品已入库（新仓库按文件夹归档，写盘与索引可能不同步）。
        # 直接查门户 API 确认版本与 wheel 文件名，避免「tag 发了、Release 也建了，
        # 但下游装不到」——索引不允许覆盖同版本，这种错误只能发新版本才能修。
        env:
          TOKEN: ${{ secrets.QINGCI_PYPI_TOKEN }}
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          tag = sys.argv[1].lstrip("v")
          url = "https://pypi.luoqingciya.cn/api/v1/packages/qingci-plugin-sdk"
          req = urllib.request.Request(
              url, headers={"Authorization": f"Bearer {os.environ['TOKEN']}"}
          )

          for attempt in range(1, 6):
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      data = json.load(resp)
              except urllib.error.HTTPError as e:
                  if e.code in (401, 403):
                      print(f"::warning::令牌无读取权限（HTTP {e.code}），跳过入库校验")
                      sys.exit(0)
                  print(f"第 {attempt} 次查询失败：HTTP {e.code}")
                  time.sleep(5)
                  continue
              except Exception as e:  # noqa: BLE001 - 网络抖动按重试处理
                  print(f"第 {attempt} 次查询失败：{e}")
                  time.sleep(5)
                  continue

              if tag in data.get("versions", []):
                  files = [f["filename"] for f in data.get("files", []) if f.get("version") == tag]
                  assert any(n.endswith(".whl") for n in files), f"{tag} 没有 wheel：{files}"
                  print(f"索引已收录 {tag}：{files}")
                  sys.exit(0)
              print(f"第 {attempt} 次未查到 {tag}，5 秒后重试")
              time.sleep(5)

          sys.exit(f"上传后未在索引中查到 {tag}（制品可能落在错误的文件夹）")
          PY

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Extract release notes from CHANGELOG
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            index($0, "## [" v "]") == 1 {flag=1; next}
            flag && substr($0, 1, 4) == "## [" {exit}
            flag {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "未从 CHANGELOG 提取到内容，回退为自动生成"
            rm -f notes.md
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 只挂 wheel 与校验和；sdist 不参与分发
          assets=(dist/*.whl dist/SHA256SUMS)
          if [ -f notes.md ]; then
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --title "$GITHUB_REF_NAME" --generate-notes
          fi
