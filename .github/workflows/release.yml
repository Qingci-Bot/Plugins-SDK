name: Release

# 打 tag 即发版：校验 → 测试 → 构建 → 上传官方 PyPI。
# 分发渠道只有 PyPI：不再上传私有索引，也不再往 GitHub Release 挂产物。
# 此前全手工（build → 手动传 wheel → 手动发 Release），而 PyPI 不允许覆盖同版本，
# 一旦传错只能发新版本，故加自动化与前置校验。
#
# 认证走 PyPI Trusted Publishing（OIDC）：仓库不保存任何长期 API token。
# PyPI 项目 qingci-plugin-sdk 已于 1.15.2 首版创建，publisher 在其 Settings → Publishing 维护
# （首版用的是 pending publisher，首次上传后自动转为正式 publisher）。字段必须与本文件一致：
#   项目名 qingci-plugin-sdk / owner Qingci-Bot / 仓库 Plugins-SDK
#   workflow release.yml / environment pypi
# 详见 docs/CODING_STANDARDS.md §6。

on:
  push:
    tags: ["v*"]

# 只读检出即可：发布不再创建 GitHub Release，写权限只留给各作业按需申请
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # 不设 UV_FROZEN：发版作业用 --locked 显式校验锁文件与 pyproject 一致
  # （UV_FROZEN 与 --locked 互斥，同时出现会直接报参数冲突）
  #
  # 分发只走 wheel：sdist 对插件开发者没有价值（本包是纯 Python，wheel 通用），
  # 却会在 PyPI 上多一份需要维护的产物，且构建 sdist 会触发一次额外的隔离构建。
  # 因此 uv build 只出 wheel，PyPI 也只收这一份产物。
  #
  # 不指定 --publish-url：uv publish 默认即官方 PyPI（https://upload.pypi.org/legacy/）。
  # 下面的项目名仅供上传后的入库校验使用。
  PYPI_PROJECT: qingci-plugin-sdk

jobs:
  verify:
    name: Verify tag / changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches __version__
        # 版本单一来源是 qingci_plugin_sdk.__version__；tag 与它不一致时直接失败，
        # 避免「发了 v1.14.0 的 tag、装出来还是 1.13.9」这类不可撤回的错误。
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("qingci_plugin_sdk/__init__.py").read_text(encoding="utf-8")
          print(re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1))
          PY
          )
          echo "tag=$tag  __version__=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag 与 __version__ $ver 不一致，请先升级版本号再打 tag"
            exit 1
          fi

      - name: CHANGELOG has an entry for this version
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if ! grep -qE "^## \[$ver\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 '## [$ver]' 段落"
            exit 1
          fi
          echo "CHANGELOG 已记录 $ver"

  test:
    name: Test before publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.12 --extra dev

      - name: Lint / format / types
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy qingci_plugin_sdk plugins/_template

      - name: Test
        run: uv run --no-sync pytest --cov --cov-fail-under=90

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"

      - name: Build wheel
        # 只出 wheel：sdist 不参与分发（见文件头 env 注释）
        run: uv build --wheel

      - name: Guard wheel contents
        # wheel 必须带 py.typed，且不得泄漏 tests/ 与 plugins/（否则会装进下游
        # site-packages，与宿主的同名目录冲突）
        run: |
          uv run --no-project python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assert "qingci_plugin_sdk/py.typed" in names, "wheel 缺少 py.typed"
          assert not any(n.startswith("tests/") for n in names), "wheel 泄漏 tests/"
          assert not any(n.startswith("plugins/") for n in names), "wheel 泄漏 plugins/"
          print(f"{whl}: {len(names)} 个文件，内容校验通过")
          PY

      - name: Checksums
        # 仅作构建记录随 artifact 留存，供人工核对；不再挂到任何 Release，也不上传 PyPI
        run: cd dist && sha256sum *.whl > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            dist/*.whl
            dist/SHA256SUMS

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      # Trusted Publishing 只需要 OIDC；build 作业不共享该权限，缩小供应链攻击面
      id-token: write
    steps:
      # 不 checkout：本作业只消费构建产物，不接触仓库代码
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.3"

      - name: Publish
        # always：强制走 OIDC，禁止回退到任何 UV_PUBLISH_TOKEN（仓库不再有上传 secret）。
        # PyPI 不允许覆盖同版本：重复上传会失败，这是有意的保护。
        # 只传 wheel（sdist 不参与分发）；SHA256SUMS 不上传 PyPI。
        run: uv publish --trusted-publishing always dist/*.whl

      - name: Verify it landed on PyPI
        # 上传返回 2xx 不等于制品已可安装（PyPI 入库与 CDN 有短暂延迟）。
        # 查公开 JSON API 确认版本与 wheel 文件名，避免「tag 发了、上传也返回成功了，
        # 但下游装不到」——PyPI 不允许覆盖同版本，这种错误只能发新版本才能修。
        run: |
          python3 - "$GITHUB_REF_NAME" <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          version = sys.argv[1].lstrip("v")
          url = f"https://pypi.org/pypi/{os.environ['PYPI_PROJECT']}/{version}/json"

          for attempt in range(1, 6):
              try:
                  with urllib.request.urlopen(url, timeout=20) as resp:
                      data = json.load(resp)
              except urllib.error.HTTPError as e:
                  print(f"第 {attempt} 次查询失败：HTTP {e.code}")
                  time.sleep(5)
                  continue
              except Exception as e:  # noqa: BLE001 - 网络抖动按重试处理
                  print(f"第 {attempt} 次查询失败：{e}")
                  time.sleep(5)
                  continue

              wheels = [f["filename"] for f in data.get("urls", [])
                        if f.get("filename", "").endswith(".whl")]
              if data.get("info", {}).get("version") == version and wheels:
                  print(f"PyPI 已收录 {version}：{wheels}")
                  sys.exit(0)
              print(f"第 {attempt} 次未查到 {version} 的 wheel，5 秒后重试")
              time.sleep(5)

          sys.exit(f"上传后 PyPI 未查到 {version} 的 wheel")
          PY

# 不设 GitHub Release 作业：分发渠道只有 PyPI，产物不再挂到 Release。
# 历史 Release（v1.15.1 及以前）保留，供主项目 Qingci-Bot-CE 的旧直链依赖继续解析。
